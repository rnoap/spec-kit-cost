schema_version: "1.0"

extension:
  id: cost
  name: "spec-kit-cost"
  version: "1.0.0"
  description: >
    Tracks estimated LLM token cost per spec-kit workflow step, appends an
    append-only USD ledger, and reports a cumulative per-spec breakdown.
  author: rnoap
  repository: https://github.com/rnoap/spec-kit-cost
  license: MIT

requires:
  speckit_version: ">=0.4.0"

provides:
  commands:
    - name: speckit.cost.record
      file: commands/speckit.cost.record.md
      description: "Compute and record the cost of the just-completed workflow step."
    - name: speckit.cost.report
      file: commands/speckit.cost.report.md
      description: "Show the per-step cost breakdown and cumulative total for the current spec."
    - name: speckit.cost.reset
      file: commands/speckit.cost.reset.md
      description: "Clear recorded cost entries for the current spec (requires confirmation)."

  config:
    - name: "cost-config.yml"
      template: "config-template.yml"
      description: "Cost tracking configuration (provider, price, model label)"
      required: false

hooks:
  after_specify:
    command: speckit.cost.record
    optional: true
    description: "Record cost after spec creation step"
  after_clarify:
    command: speckit.cost.record
    optional: true
    description: "Record cost after spec clarification step"
  after_plan:
    command: speckit.cost.record
    optional: true
    description: "Record cost after implementation planning step"
  after_tasks:
    command: speckit.cost.record
    optional: true
    description: "Record cost after task generation step"
  after_analyze:
    command: speckit.cost.record
    optional: true
    description: "Record cost after spec analysis step"
  after_checklist:
    command: speckit.cost.record
    optional: true
    description: "Record cost after checklist generation step"
  after_implement:
    - command: speckit.cost.record
      optional: true
      description: "Record cost after implementation step"
    - command: speckit.cost.report
      optional: true
      description: "Display cumulative cost breakdown after implementation completes"

tags:
  - cost
  - tokens
  - budget
  - observability
  - ledger

config:
  defaults:
    provider: self-report
    price_per_1k: 0.003
    model: unknown
